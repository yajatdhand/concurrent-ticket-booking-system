# Example Spring Boot configuration for local development.
# Copy these values into your local application.properties or configure
# the corresponding environment variables before running the application.

spring.application.name=TicketBookingSystem

spring.datasource.url=jdbc:postgresql://localhost:5432/ticket_booking_system
spring.datasource.username=your_postgres_username
spring.datasource.password=your_postgres_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
